# 发布：tag（v*）触发 → 复跑三平台出包 → 收集产物 → 生成更新日志 → 发 GitHub Release。
#
# 流程（对应 VERSIONING.md 与 release.mjs 的既有约定）：
# - 版本号住两处（package.json + packages/desktop/package.json），打 tag 前必须已递增
#   并同值（release.mjs --write 在本地完成，tag 推到远端触发本 workflow）；
# - 三平台产物在各自免费 runner 上重新打出（与 build-matrix 同一条 pack.mjs 链），
#   保证 Release 资产与 tag 完全同源；
# - 更新日志由 release.mjs 生成（取上个 tag 以来的 conventional commits + 台账注意事项）。
name: release

on:
  push:
    tags: ['v*']

jobs:
  package:
    name: package ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: darwin, os: macos-latest,  platform: darwin, arch: arm64 }
          - { target: linux,  os: ubuntu-latest, platform: linux,  arch: x64   }
          - { target: win32,  os: windows-latest, platform: win32, arch: x64   }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile
        shell: bash

      - name: Linux 出包前置（AppImage 需 libfuse2 + 沙箱需可用 bubblewrap）
        # 与 build-matrix.yml 同名步骤同理：`checkSandboxPrereq()` 在 `fast` 档就会 fail，
        # 缺 bwrap 时 release 的 smoke 步必然红（且那是**真缺陷信号**，不是环境噪声）。
        #
        # ⚠️ **装上包还不够**（2026-10-12 发布实测，v0.3.0 首跑即挂在此处）：
        # ubuntu-latest 是 24.04，默认 AppArmor 限制非特权 user namespace ⇒ bwrap 装上了
        # 但 profile 起不来 ⇒ 判据报 `bwrap 存在但 profile 起不来`、整个 linux job 失败。
        # 放开该限制让判据验**真的能起沙箱**（而不是放松判据造一个假绿）。
        # 不装 xvfb：本 workflow 的产物验证走上面那条**无 GUI 依赖**的启动断言，不做 GUI 启动。
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update && sudo apt-get install -y libfuse2 rpm bubblewrap
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Pack ${{ matrix.target }}
        working-directory: packages/desktop
        run: node scripts/pack.mjs ${{ matrix.target }} --arch=${{ matrix.arch }}
        shell: bash

      - name: 产物宿主启动断言（**发布阻断级硬门禁**）
        # 见 build-matrix.yml 同名步骤的完整说明。这里是**严格版**：失败即停，
        # 绝不发布一个「打出来了但起不来」的产物（2026-10-12 Windows 白屏的教训）。
        run: node scripts/assert-packaged-boot.mjs --platform=${{ matrix.platform }} --arch=${{ matrix.arch }}
        shell: bash
        working-directory: ${{ github.workspace }}

      - name: Smoke（静态守卫：产物内部混装）
        # 与上面那条分工不同、不可互替（详见 build-matrix.yml）。release 里保持严格：
        # 静态守卫若红，说明产物内部混装，同样不该发。
        run: node scripts/corum-smoke.mjs --fast
        shell: bash
        working-directory: ${{ github.workspace }}
        env:
          CDP_PORT: 9333

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: corum-${{ matrix.target }}
          path: |
            packages/desktop/dist/*.dmg
            packages/desktop/dist/*.zip
            packages/desktop/dist/*.AppImage
            packages/desktop/dist/*.deb
            packages/desktop/dist/*.exe
            packages/desktop/dist/*.blockmap
          if-no-files-found: error # 发布必须出齐产物，缺即失败

  publish:
    name: publish release
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write # 创建 GitHub Release
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # release.mjs 需要完整 tag 历史定基线

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm

      - name: Install（release.mjs 依赖）
        run: pnpm install --frozen-lockfile

      - name: Download all platform artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist-release
          merge-multiple: true

      - name: 生成更新日志（手工版优先，否则 release.mjs 生成）
        # 手工版优先（用户 2026-10-12 定调）：`RELEASE-NOTES/<tag>.md` 存在就直接用它。
        # 理由：脚本按「feat 优先」选 TOP5，会把用户痛感最强的 fix 全挤掉（如「MCP guidance
        # 让 Agent 完全打不开」），且注意事项取自台账原文、含已被推翻的旧结论；人工版可重排
        # 与剔除。不存在时**行为与以前完全一致**（回落到脚本生成）。
        #
        # release.mjs 默认基线是「最近 tag」，但发布时当前 tag 就是最新的 ⇒
        # 不指定会取到当前 tag 自己（无新提交 → exit 1）。故显式 --since 指向上一个 tag。
        run: |
          HAND="RELEASE-NOTES/${{ github.ref_name }}.md"
          if [ -f "$HAND" ]; then
            echo "使用手工发版说明：$HAND"
            cp "$HAND" release-notes.md
          else
            PREV_TAG=$(git tag --sort=-creatordate | grep -v "^${{ github.ref_name }}$" | head -1)
            echo "无手工版；基线 = ${PREV_TAG:-首个提交} → 当前 ${{ github.ref_name }}（release.mjs 生成）"
            if [ -n "$PREV_TAG" ]; then
              node scripts/release.mjs --since="$PREV_TAG" > release-notes.md
            else
              node scripts/release.mjs > release-notes.md
            fi
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          body_path: release-notes.md # 手工版（RELEASE-NOTES/<tag>.md）或 release.mjs 生成的 TOP5 + 注意事项
          files: dist-release/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
