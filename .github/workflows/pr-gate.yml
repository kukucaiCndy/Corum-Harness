# PR 门禁：typecheck + vitest + build（全部 Linux 免费 runner，公开仓零费用）。
#
# 设计取舍（对应台账 decision.cicd-topology-public-github-hosted-pro-self-hosted-deferred）：
# - 这层**不打包、不出产物**——打包慢且贵（墙钟），PR 门禁要的是快速反馈；
# - 单 job 串行跑 typecheck → build → test，避免 matrix 爆炸
#   （GitHub 按 job 计费/取整，多个小 job 反而烧分钟）；
#   顺序刻意 build 在前：测试可能 import 构建产物，见 Build 步骤注释；
# - fork-drift 守卫**不在此跑**：它依赖本地官方 dsh checkout（/Users/kukucai/dsh）
#   做逐字节比对，CI 上没有 ⇒ 留作本地 pre-push 门禁（见 README / dev-conventions）。
name: pr-gate

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: pr-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      # ⚠️ `fetch-depth: 0` 是**必须的**，不是提速/降速旋钮（2026-10-12 实测）：
      # `corum-agent/tests/fold-equivalence.spec.ts` 的判据本身要**读 git 历史**
      # （`git log -S foldSubagentProgress -- <path>` 取出历史某一版源码，再与 HEAD 原文比等价）。
      # checkout 默认 `fetch-depth: 1`（浅克隆）⇒ 那个 `git log -S` 找不到任何提交，
      # 测试以「判据前提失效」失败——而它在本地（完整克隆）永远绿。
      # 形态特征：只有这一个 spec 红、报的是"找不到含 X 的提交"，看着像测试自己写坏了。
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        # packageManager 字段（pnpm@11.7.0）已钉死版本，无需在此重复指定。

      - uses: actions/setup-node@v4
        with:
          node-version: '22' # engines: ^22.19.0 || >=24.0.0；取最低支持线保证兼容
          cache: pnpm

      - name: Install
        # verdaccio 已彻底移除（2026-10-08）：@deepseek-ai 全部走公共 registry
        # （0.1.5-rc.3 在 npmmirror/npmjs 均可达），无需任何 registry 绕行。
        run: pnpm install --frozen-lockfile

      - name: Typecheck (all packages)
        run: pnpm -r --filter './packages/**' run typecheck

      - name: Build (all packages)
        # 全量构建是「能真正被加载的产物」的判据（AGENTS：编译过 ≠ 能加载）。
        # UI 包三步（tsc && tsdown && inline-css）在各自 build 脚本内闭环。
        # 必须在测试之前：部分测试 import 的是 workspace 包的构建入口
        # （如 preset-modules → @corum/corum-mcp-manager 的 lib/index.js，
        # 由 tsdown 产出；光 typecheck 的 tsc -b 写不出它），全新 checkout
        # 里先测必挂（本地能过只是 lib/ 缓存）。
        run: pnpm -r --filter './packages/**' run build

      - name: Plugin spec gate
        # 规范守卫（docs/PLUGIN-SPEC.md + scripts/verify-plugin-spec.mjs）。
        # 这类缺陷「编译过、测试绿」也发现不了，所以必须是**独立判据**：
        # exports 指向 TS 源码、客户端构建缺 inline-css 步、dsh.client 与 ./client 不配对、
        # 兼容声明缺字段/自相矛盾、未登记的 exports 子路径。
        # 必须在 Build 之后跑：它断言 exports 目标文件真实存在，全新 checkout 里 Build 前
        # lib/ 还不存在（守卫的 NO-ARTIFACT 是 warn，--strict 会把它判失败）。
        run: node scripts/verify-plugin-spec.mjs --strict

      - name: Plugin guide gate
        # 指南随 @corum/plugin-sdk 发布 ⇒ 指南里的每条断言都必须与实现一致。这条守卫会
        # ①核对包内 GUIDE.md 与文件清单、②核对指南提到的 API 在产物 d.ts 里真的导出、
        # ③核对区域白名单与契约包一致、④在临时目录真跑一遍脚手架并断言生成物形状。
        # 必须在 Build 之后跑：它读的是 lib/ 的产物 d.ts。
        run: node scripts/verify-plugin-guide.mjs

      - name: Unit tests (all packages that define test)
        run: pnpm -r --filter './packages/**' --if-present run test

  # ── 三平台测试（红线 7 的门禁化）────────────────────────────────────────────
  # 起因（2026-10-20，PR #106 复核）：它的 5 个 desktop 测试**在 macOS 上必挂**
  # （夹具拿未 realpath 的 `os.tmpdir()` 路径（`/var/folders/…`）去比 host 返回的
  #  realpath 值（`/private/var/…`）），而 gate 只跑 ubuntu ⇒ 绿着进了主干。
  # 这类缺陷「本地绿/CI 绿、另一平台红」，靠自觉永远发现不了，必须是独立判据。
  #
  # 取舍：不跑全仓 build 是**行不通的**（2026-10-20 首跑实测）：`@deepseek-ai/dsh-tools`
  # 被 `pnpm-workspace.yaml` 的 override 指到 `workspace:@corum/corum-tools@*`，而
  # corum-tools 的测试 import 的正是它的构建产物 `lib/`——只建 desktop lib 会让整片
  # `Cannot find module '@deepseek-ai/dsh-tools'` 红。这里的 build 只是各包的
  # tsc/tsdown/inline-css，**不含** electron-builder 打包链路（那才是 Windows 上的
  # 不稳定源，pr-gate 本来就不跑它）。
  platform-tests:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0        # 同上：fold-equivalence.spec 要读 git 历史

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck (all packages)
        run: pnpm -r --filter './packages/**' run typecheck

      - name: Build (all packages)
        # 与 gate 的 Build 同一判据、同一顺序（build 在 test 之前）：见本 job 顶部注释
        # ——不构建时 corum-tools 的测试整片解析不到 `@deepseek-ai/dsh-tools`。
        run: pnpm -r --filter './packages/**' run build

      - name: Unit tests (all packages that define test)
        run: pnpm -r --filter './packages/**' --if-present run test
