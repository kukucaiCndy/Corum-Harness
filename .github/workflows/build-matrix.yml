# 三平台出包矩阵：**手动触发**（workflow_dispatch），产出各平台安装包
# （全部 GitHub 免费 runner）。
#
# 为什么不挂在 push:main：每次推主干都跑三平台 60 分钟出包，浪费且反馈慢——
# 日常质量由 pr-gate（typecheck+test+build，快）把守；出包只在「要看产物」时
# 手动点，正式发布走 release.yml 的 tag 触发（那里会复跑同一条 pack.mjs 链）。
#
# 拓扑（台账 decision.cicd-topology-public-github-hosted-pro-self-hosted-deferred）：
# - macOS 闭包物理上只能在 macOS 上打（codesign/dmg 工具链）⇒ macos-latest；
# - Linux 出包 ⇒ ubuntu-latest；Windows 出包 ⇒ windows-latest；
# - 原生依赖必须本机 install（交叉打包已被实测证伪）⇒ 三个 runner 各自完整
#   install → build → pack，互不交叉；
# - pack.mjs 四步链（build → pack:host → pack:node → pack:app）自带平台钉死 +
#   烘入常量 + 运行时一致性断言；产物内部混装由冲烟 checkNodeRuntimePlatform 抓。
name: build-matrix

on:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    name: package ${{ matrix.target }}
    strategy:
      fail-fast: false # 一个平台挂了不影响另两个出包
      matrix:
        include:
          - { target: darwin, os: macos-latest,  platform: darwin, arch: arm64 }
          - { target: linux,  os: ubuntu-latest, platform: linux,  arch: x64   }
          - { target: win32,  os: windows-latest, platform: win32, arch: x64   }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm

      - name: Install
        # verdaccio 已彻底移除（2026-10-08）：@deepseek-ai 全部走公共 registry。
        run: pnpm install --frozen-lockfile
        shell: bash

      - name: Linux 出包前置（AppImage 需 libfuse2 + 沙箱需 bubblewrap）
        # bubblewrap 是**真判据**而非环境装饰：缺它时 checkSandboxPrereq 会硬失败
        # （官方链 linux:["bwrap","landlock"] fail-closed ⇒ Agent 的 bash 全失败）。
        # 装上它，那条断言就从「红色噪声」变成可置信的绿。
        if: matrix.platform == 'linux'
        run: sudo apt-get update && sudo apt-get install -y libfuse2 rpm bubblewrap

      - name: Pack ${{ matrix.target }}（四步链 + 平台钉死）
        working-directory: packages/desktop
        run: node scripts/pack.mjs ${{ matrix.target }} --arch=${{ matrix.arch }}
        shell: bash

      - name: 产物宿主启动断言（**硬门禁**：无 GUI 依赖，三平台通用）
        # 2026-10-12「Windows 包白屏」事故的直接对策，也是本 workflow 里**唯一**能把该类
        # 缺陷挡在产物之外的一道闸。用**产物自带的** Node 跑**产物自己的** host 桥，
        # 因此在**目标平台语义**下验证（而非宿主语义，避免 pack-macos 的 smokeBridge 那种假绿）。
        # 判据：exit 0 + stdout 出现 "type":"ready" + 无已知致命行。三类平台绑定缺失
        # （sharp / node-addon-require-builtin / ripgrep）任一残留都会让它失败。
        # 刻意**不**设 continue-on-error：它红了产物就是坏的，上传只浪费下游时间。
        run: node scripts/assert-packaged-boot.mjs --platform=${{ matrix.platform }} --arch=${{ matrix.arch }}
        shell: bash
        working-directory: ${{ github.workspace }}

      - name: Smoke（静态守卫：产物内部混装 checkNodeRuntimePlatform）
        # 与上面那条**分工不同、不可互替**：
        #   - 本步查 `build/node` 运行时**是不是目标平台**（抓内部混装）；
        #   - 上面那条查**闭包内平台专属依赖是否齐备** + 宿主树能否真的挂起来。
        # runner 无显示、无沙箱（缺 bwrap / 无 GUI 会话），launch 类项会环境性失败
        # ⇒ 这里只收信号、不挡产物（launch 级判定已由上面那条无 GUI 依赖的断言覆盖）。
        # 发版门禁走 release.yml（严格版，失败即停）。
        continue-on-error: true
        run: node scripts/corum-smoke.mjs --fast
        shell: bash
        working-directory: ${{ github.workspace }}
        env:
          CDP_PORT: 9333

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: corum-${{ matrix.target }}
          path: |
            packages/desktop/dist/*.dmg
            packages/desktop/dist/*.zip
            packages/desktop/dist/*.AppImage
            packages/desktop/dist/*.deb
            packages/desktop/dist/*.exe
            packages/desktop/dist/*.blockmap
          if-no-files-found: warn
          retention-days: 14
