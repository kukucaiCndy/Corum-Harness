# The corum-desktop bundle patch: the desktop surface over the web profile.
# Applied as the HIGHEST overlay layer when the Electron main boots the `web`
# profile.
#
# Transport stance (0.1.2): the official web transport is RETAINED. The
# renderer no longer rides a custom IPC bridge — it loads the official web
# surface over loopback HTTP directly (`loadURL` of the authenticatedUrl the
# host reports). This overlay therefore only PINS the official rows for the
# desktop: loopback-only bind on an ephemeral port, no default-browser
# handoff, and no URL line (the shell owns the window). The rest of the web
# composition (agent presets, every ui-* row, storage, workspace, session
# projection, the base rows) stays untouched.
#
# A patch replaces the targeted row's whole config; `disabled: true` takes the
# row out of the tree without deleting it, so the web surface remains intact
# for a plain `dsh web` boot that never applies this overlay.

# ── official web transport, pinned for the desktop surface ─────────────────

# node:http server + route registry. The renderer reaches it over loopback on
# an ephemeral port (port 0 → the OS assigns one; the host reads the real port
# back from ctx.webServer.port and reports it to the Electron main).
- id: webserver
  config:
    host: '127.0.0.1'
    port: 0
    compression: gzip
    compressionLevel: 1
    compressionThresholdBytes: 1024

# Web glue (dist serving via the webserver fallback seat, web-surface prompt,
# bash variable). The desktop shell owns its window: never open the default
# browser and never print the URL line — the host reports the authenticatedUrl
# to the Electron main over the bridge instead.
- id: web-runtime
  config:
    openBrowser: false
    printUrl: false
    surfaceContext: true
    trustedHosts: []

# ── KV storage backend: sqlite (user decision 2026-09-15) ──────────────────
#
# The base bundle routes every domain to the JSON backend (`storage-domain`
# config.backend: json, root $DSH_HOME/storages). The user asked for the KV
# layer to move to SQLite, so this overlay adds the official sqlite backend
# and repoints the domain default at it.
#
# Scope (user 2026-09-15, ledger architecture.storage.sqlite-as-unified-backend):
#   · GLOBAL units only — `workspace`, `message_feedback`, `corum_orchestration`.
#   · `session_projcache` is NOT migrated: it is disposable derived data
#     (dsh-session-projection-cache/spec.ts `invalidRecords: 'backup-and-skip'`),
#     so the sqlite side starts empty and cold reads rebuild it.
#   · Per-project tables (`corum_project_<id>` under `<cwd>/.corum/project/`)
#     are NOT affected: they never route through this domain default — corum
#     registers a per-project JsonStorageBackend instance (`corum-project:<cwd>`,
#     see **closed-source** Corum-Harness-Project
#     `packages/corum-project/src/project-data-backend.ts`; the file lived at
#     corum-agent/project-data-backend.ts before the 2026-09-26 project-mode
#     split-out). That keeps the §2 "project data travels with the project,
#     readable and git-diffable" model intact.
#
# Why ADD a row instead of replacing storage-json: the two backends register
# under different hub names (`json` / `sqlite`). Replacing the row would remove
# the `json` name, and corum's DomainFacility defaults plus the per-project
# backend construction both rely on it. Adding keeps both names registered and
# moves only the domain default.
#
# ⚠️ node:sqlite has NO SQLCipher/SEE — `PRAGMA key` is silently a no-op here
# (measured: a marker string stayed plaintext in the db file either way). The
# database is therefore NOT encrypted at rest; encryption of sensitive values
# stays an application-layer concern (corum-credentials-local/value-crypto.ts).
- insert:
    - id: storage-sqlite
      name: '@deepseek-ai/dsh-storage-sqlite'
      config:
        path: !!js dshHomePath('storages', 'kv.sqlite')
        journalMode: wal

# Repoint the domain default at the sqlite backend. `routes` is deliberately
# left unset: every domain without an explicit route follows `backend`, and no
# domain in this distribution declares one today.
- id: storage-domain
  config:
    backend: sqlite

# ── rows disabled for the desktop surface ──────────────────────────────────

# The official session-log download: a browser surface — its controller drives
# a GET /api/session.export streamed to the browser download manager (an
# `a[download]` click + a "browser is downloading" modal). The native-save
# flow in @corum/corum-session-archive replaces it — so the row is disabled to
# keep one minimal save action and to stop the stray browser-download dialog.
- id: session-log-download
  disabled: true

# The official Models settings page is forked into @corum/corum-ui-settings-models:
# the fork adds a per-model "image input" switch so a hand-declared
# vision-capable model can declare `input: [text, image]` from the UI (the
# official editor only surfaced contextWindow/maxTokens). Disable the official
# row and mount the fork below so only one Models section registers.
- id: ui-settings-models
  disabled: true

# The official model selector is forked into @corum/corum-ui-model-selection: the
# fork presents a rejected model switch caused by an image-containing session
# (model-unavailable) as a friendly info hint instead of a generic
# "operation failed" error toast.
- id: ui-model-selection
  disabled: true

# The official Plugins settings surface is forked into
# @corum/corum-ui-settings-plugins: the fork removes the official
# SubagentModelSelectionCard (the "let the LLM pick the subagent model" switch)
# — that switch is semantically incompatible with fork #10's model lock
# (config.model is a mechanism-fixed route with no LLM parameter surface), and
# keeping it would mislead users. The fixed-route configuration lives in the
# corum「子 Agent」settings section (corum-subagent namespace). Disable the
# official row and mount the fork below so only one Plugins section registers.
- id: ui-settings-plugins
  disabled: true

# The auto directory picker resolves bind host / SSH / display, then mounts a
# browse or native backend — the browse backend and the auto row itself inject
# webServer. The desktop surface pins the native backend (koffi FFI, no HTTP).
- id: directory-picker
  disabled: true

# API Key 加密落盘（TODO 安全项）：官方 dsh-credentials-local 把凭证明文写入
# `$DSH_HOME/.credentials.yaml`（仅 0600 权限，无加密）。corum 的 fork 包
# @corum/corum-credentials-local 在 durable 边界对 ref 值与 api-key record 的
# key/env 值做 AES-256-GCM 加密（enc:v1: 前缀，存量明文条目双读兼容），主密钥
# 由 Electron main 经 safeStorage 封装后注入（CORUM_CREDENTIALS_MASTER_KEY）。
# 官方行在 base bundle 的 insert 块内——compose 的行覆盖对 insert 行按序追加而
# 非替换（同名服务会 duplicate-registration 失败），故沿用本文件的既有纪律：
# 先禁用官方行，再在下方 insert 段以同 id 挂 fork。下游（llm 适配器 /
# Models 页 / credentials RPC）对服务名 `credentials` 的引用零感知。
- id: credentials
  disabled: true

# 统一事件中心一期（docs/agent-foundation/UNIFIED-EVENT-BUS.md）：官方
# dsh-api-remotes 的转发 allowlist 是编译期硬编码常量、registerRemoteEvents 是
# singleton（重复注册抛错），零改动官方包无法扩展事件名。fork 包
# @corum/corum-api-remotes 整文件照抄官方 165 行转发循环 + 162 行 client
# contribution 挂载，仅给 API_REMOTE_FORWARDED_EVENTS 追加 13 个 corum 事件
# （emit 形态；corum/task/* ×10 + corum/group/* ×2 + corum/terminal/output）。
# 官方行在 base bundle（packages/bundle/web-app/cordis.patch.yml）的 insert 块
# 内（行 id `api-remotes`），先禁用再在下方 insert 段挂 fork（行 id 不同名——
# loader 对同层 id 唯一性检查，见下方 insert 段注释）。cordis 服务名
# `typertGateway`/`remote` 不变，renderer 各 ui-* 插件对 ctx.remote 的消费
# （$mount/$on）零感知。
- id: api-remotes
  disabled: true

# 子 Agent 编排框架（docs/plan/PLAN-subagent-orchestration.md，fork #9 转正）：
# 官方 dsh-subagent seam 的 SubagentStartRequest 无 cwd 字段——worktree 硬隔离
# 需要子会话 header.cwd 可指定（fs 写沙箱边界/shell/{{cwd}} 全跟随）。fork 包
# @corum/corum-subagent 现以**完整服务**取代官方 seam（服务名 `subagents` 不变，
# 同 credentials/api-remotes 的「禁官方行 + insert fork 完整包」纪律）：先禁用
# 官方 subagent 服务行，再在下方 insert 段挂 fork 完整包 + corum-spawn provider。
# 服务名不变 → 官方 provider 行（spawn/fork）与 tool-subagent-control
# （send_message/interrupt/list_agents）对 `subagents` 的 inject 零感知。
- id: subagent
  disabled: true

# 隔离子 Agent 的 git 提交（2026-09-09 用户实机复现，docs/TODO.md）：官方
# dsh-sandbox-local 的可写根 = workspaceRoot + /tmp + tmpdir；隔离 worktree 的
# cwd 是 `.corum-worktrees/wt-xxxx`，而 `git add/commit` 要写的是**主仓 .git**
# （worktrees/<slug>/index.lock、objects、refs）——在 workspace 之外，Seatbelt
# 直接 EPERM（实测 `index.lock: Operation not permitted`），子 Agent 永远提交
# 不了。fork 包 @corum/corum-sandbox-local 唯一增量 = 三个平台 profile builder
# 的可写根并集 workspace 的 git 元数据目录（index.ts 与官方逐字节一致）。
# 先禁用官方 sandbox 行，再在下方 insert 段挂 fork（服务名 `sandbox` 不变 →
# bash/pwsh-sandbox 与 shell 对 ctx.sandbox 的消费零感知）。
- id: sandbox
  disabled: true

# goal 轮驱动（fork #17，2026-09-27）：官方判据只有「`agent.status === 'idle'`」，而后台委派一
# 交派出去、父 Agent 的回合就结束变 idle（子在跑）⇒ 驱动立刻空转开新轮 —— 用户实测
# 「Agent 在指派子代理或等待结果时反复唤醒」。fork 增量 = **该 Agent（含其派生的子/孙）名下
# 尚有在飞 subagent run 时不开新轮**，并在 `subagent/end` 时对发起方重新评估（结果回来继续推进）。
# 官方行在 base bundle 的 insert 块内 ⇒ 沿用本文件纪律：先禁用官方行，再在下方 insert 段以
# 不同行 id 挂 fork（官方事件名与提示词零改动，其它行零感知）。
- id: goal-round-driver
  disabled: true

# ── desktop persona ─────────────────────────────────────────────────────────

- id: system-prompt
  config:
    persona: >-
      You are a coding agent powered by the {{model}} model. Your working directory is {{cwd}}.

      You are running inside the DeepSeek Harness desktop application.

# ── the desktop rows ────────────────────────────────────────────────────────

- insert:
    # 会话日志归档（Web-only client 插件，无 host 贡献）：native 保存/导入走
    # 桌面桥（preload.ts 的 saveSessionLog/importSessionLog IPC），取代上方
    # 禁用的官方 session-log-download。P0-2（2026-09-14）恢复挂载——733d3b70
    # 曾连同行一起整拆（当时定调移除全部 UI 入口），本轮用户裁决恢复
    # 「保存到…」（会话头部 utilities 槽）与「导入会话日志」（临时挂
    # settings.section 自成设置 section；原槽 settings.general.item 是 corum
    # 死槽，待 P0-5 修渲染点后迁回），不恢复「删除会话」按钮。行 id 沿用
    # 历史值 session-archive（733d3b70^ 同款）；短 id 纪律同 corum-ollama
    # （client bundle URL 为 /plugins/<行 id>/client.js）。⚠️ 必须在本
    # insert 块内：applyEntryPatches 对无 insert 的补丁行只做 id 定向
    # override，匹配不到即丢弃——顶层新增行永远不会进 composition。
    - id: session-archive
      name: '@corum/corum-session-archive'

    # Forked encrypted credentials provider (replaces the disabled official
    # credentials row above). NOTE: the row id must differ — the loader rejects
    # a top-level id that collides with a (even disabled) bundle-inserted row
    # ("duplicate loader entry id"), which is also why the settings-models
    # forks above carry the corum- prefix. The cordis SERVICE name stays
    # `credentials` (the fork's provider class calls super(ctx, 'credentials')
    # exactly like the official one), so llm adapters / the Models page / the
    # credentials RPC surface — all of which inject the service, not the row
    # id — see zero difference.
    - id: corum-credentials
      name: '@corum/corum-credentials-local'

    # Forked Remote BFF assembly (replaces the disabled official api-remotes
    # row above): the official 17 forwarded events plus 13 corum domain events
    # (corum/task/*, corum/group/*, corum/terminal/output). The row id must
    # differ from the official `api-remotes` (same loader uniqueness rule as
    # corum-credentials above); the cordis SERVICE names stay `typertGateway`/
    # `remote`, and the fork's package.json `dsh.client` block is preserved
    # verbatim (inject dsh-api-gateway, platform web, immediately) so the
    # client half mounts the Remote contributions exactly like the official.
    - id: corum-api-remotes
      name: '@corum/corum-api-remotes'

    # Fork #15（session-queue-revert）：**增量补丁**（host-only，无 client
    # 半；官方 session-controller 行保持启用——其 client.js 是 client 侧
    # `sessions` 服务的唯一 provider，禁它会让 20 个 client 插件卡在
    # waiting for service）。本插件在官方服务激活后**就地覆写**其
    # commands.updateQueue：QueueAction 新增 { kind: 'requeue' }（插话撤回
    # → 退回队首；官方 remove 是纯丢弃），其余 17 个 Remote 方法与非
    # requeue 分支全部走官方/vendored 实现（红线 3：本地能力接口收窄，
    # 不耦合实现包）。
    - id: corum-session-queue-revert
      name: '@corum/corum-session-queue-revert'

    # git-core（corum 核心插件，**不可卸载**）：承载全部 git 管理机制（用户
    # 2026-09-16 策略）。① 工作区 git 侦测/初始化（ensureRepo/isRepo/init，
    # 能力自 desktop host 的 corum-git.ts 迁入）；② 不变式①「工作区必须有 git
    # 参考」的 host 创建入口强制前置（assertGitWorkspace 门禁——corum-agent 的
    # createAgentForTask / corumProject 的 openProject 等入口经 ctx.gitCore 同进程
    # 直调，失败 fail-loud 阻断创建，不再依赖 UI 层自觉）；后续承接 worktree/settle
    # 强制提交 / 集成真值 / 隔离判定 / 合并链（四条不变式统一由本插件能力完成）。
    # **行序必须在 corum-agent / corumProject 装配之前**（它们 inject ctx.gitCore）。
    # 2026-09-26 项目模式剥离：`corumProject` 插件已迁到闭源仓 Corum-Harness-Project
    # （`@corum/corum-project`），**本行序约束对它同样成立**——闭源组合把它插在
    # corum-agent 之前，自然也在本行之后。
    # ⚠️ 本插件不可卸载：插件管理器按包名 @corum/corum-git-core 过滤启停/卸载入口。
    - id: corum-git-core
      name: '@corum/corum-git-core'

    # platform（corum 核心插件，**不可卸载**，2026-10-08 P0）：平台的**行为事实源**
    # —— getPlatform() 返回实际运行平台（process.platform，回答「我现在跑在哪」）；
    # getBakedTargetPlatform() 返回打包时烘入的目标平台（回答「这份产物是为谁打的」，
    # 仅供一致性断言/诊断，**禁止用于选实现**）。渲染层经 preload 的
    # window.corumDesktop.getPlatform() 同步查询（合法 window 挂载）。
    # **行序必须尽量靠前**：后续所有要按平台选实现的插件（P1 的 platform/ 目录
    # 消费面）都 inject ctx.platform。
    # ⚠️ 本插件不可卸载：插件管理器按包名 @corum/corum-platform 过滤启停/卸载入口。
    - id: corum-platform
      name: '@corum/corum-platform'

    # Fork #9 完整 seam 服务（取代上方禁用的官方 subagent 行）：
    # 服务名 'subagents' 不变（fork 的 SubagentRuntime super(ctx,'subagents')
    # 与官方一致），官方 provider 行（spawn/fork）与 tool-subagent-control
    # 对 ctx.subagents 的 inject/registerProvider 零感知。这使 fork #9 的
    # childSessionMeta(4 参) cwd 透传 + assertChildCwd 在运行时真正生效
    # （消除 REVIEW 的「SEAM 死代码」硬伤：continuable 路径隔离从此生效）。
    - id: corum-subagent
      name: '@corum/corum-subagent'

    # Fork #17：goal 轮驱动（取代上方禁用的官方行）。唯一增量见该包 src/index.ts 的
    # 「corum fork delta（fork #17）」段与 tests/pending-delegation.spec.ts。
    - id: corum-goal-round-driver
      name: '@corum/corum-goal-round-driver'

    # Fork #12：本地沙箱 provider 的 corum 版（取代上方禁用的官方 sandbox 行）。
    # 服务名 `sandbox` 不变（fork 的 LocalSandboxProvider super(ctx,'sandbox')
    # 与官方一致）；增量 = 可写根并集 workspace 的 git 元数据目录，让隔离子
    # Agent 能在自己的 worktree 里正常 git add/commit。
    - id: corum-sandbox
      name: '@corum/corum-sandbox-local'

    # Fork #9 spawn provider：注册 'corum-spawn' provider 进 fork 的 subagents
    # seam——与官方 spawn/fork provider 并存不冲突。provider 行与完整服务行
    # 分开挂载（与服务注册相同的官方 base bundle 结构）。
    - id: corum-subagent-spawn
      name: '@corum/corum-subagent/spawn'

    # Fork #9 fork provider（2026-09-10 用户要求「三个工具按 corum 机制改造，保证
    # 官方能力被包含」）：注册 'corum-fork'——官方 fork 语义（子会话以父会话已完成
    # 轮次为种子 / KV cache 复用）不变，但 driver 换成 corum 的（cwd 透传 + 校验），
    # 否则官方 provider 会忽略 request.cwd：台账以为隔离、子 Agent 实际仍在主工作区。
    - id: corum-subagent-fork
      name: '@corum/corum-subagent/fork'

    # Fork #9 isolated provider（2026-09-10 用户定调「把 workflow 的设计语义吸收进
    # orchestrate」）：注册 'corum-isolated'——把工具层的隔离机制搬到 provider 层，
    # 让 workflow 引擎里的 agent() 子会话也建 worktree + 进台账 + 注入隔离纪律。
    # orchestrate 的 script 模式按 run 指定它（subagentProvider 覆盖）。
    - id: corum-subagent-isolated
      name: '@corum/corum-subagent/isolated'

    # Fork #9 tracked provider（2026-09-10 用户「ralph 一并纳入」）：注册 'corum-tracked'
    # ——不建 worktree（ralph 每轮必须看到上一轮改动），但把子会话登记进「在跑写子 Agent」
    # 计数并注入直连纪律，让其它委托看得见「有人在写主树」而选择隔离。
    - id: corum-subagent-tracked
      name: '@corum/corum-subagent/isolated'
      config:
        providerName: corum-tracked
        mode: track

    # Fork #10 编排器独立包（docs/plan/PLAN-refactor-orchestration-package-and-
    # settings-center.md 重构 1）：新包自己挂 cordis 行 provide（独立性最彻底），
    # apply 在根上下文幂等 provide `corumOrchestration`。行序**必须**在下方
    # corum-tool-subagent 的 preset 双实例 apply 之前——tool-subagent 的 apply
    # 已改「只读不建」（ctx.root.get('corumOrchestration') 缺则抛装配错误），
    # 顺序由本行序承担，不再幂等自建兜底。挂载顺序需 CDP 实机验证：编排器
    # 必须在 tool-subagent 双实例 apply 前就绪。
    - id: corum-orchestration
      name: '@corum/corum-orchestration'

    # Fork #10 工具包本体不单独挂行——工具实例由 corum preset 的 delegation 组
    # 双实例行（tool-subagent / tool-subagent-research，corum-agent compile.ts
    # 生成，name '@corum/corum-tool-subagent'）按会话挂载；host 侧只需包可
    # 解析（desktop deps 已链）。官方 base 的 tool-subagent 行保留：官方
    # subagent_fork / codex / claude-code 实例与 workflow 只读 fan-out 继续走它。
    # invariant 不挂（官方组合未挂 subagent-invariant，fork 对齐同纪律）。
    #
    # ⚠️ **但 settings namespace 必须 boot 常驻**（2026-09-18 修复，用户报障驱动）：
    # `corum-subagent` ns 原先只在上面那些"按会话 apply"的工具实例里注册 ⇒ **冷启动
    # （不建任何 corum 会话）时该 ns 不存在**，实测 `settings/describe` 里没有它，后果：
    # ① 设置→智能体 那两个「子 Agent 默认模型」显示为**空**（settings.yaml 里明明有值）；
    # ② 写入报 `settings namespace "corum-subagent" is not registered`；
    # ③ **新建预设的模板预填读不到值**（该配置项的全部意义就是当模板）。
    # 对照：同类 ns `subagent-model-selection-settings` 在官方 web-app bundle 里**有 host
    # 行**，故它冷启动即在册。本行就是给 `corum-subagent` 补上同样的时机。
    # 行序在 tool-subagent 的 preset apply 之前 ⇒ 本行先注册；工具实例侧走
    # `acquireCorumSubagentSettingsScope`（容忍"已被注册"，官方 register 对重复注册抛错）。
    - id: corum-subagent-settings
      name: '@corum/corum-tool-subagent/settings-registrar'

    # Native-only directory picker (the desktop always sits on the host
    # display); replaces the disabled auto row above. The `-auto` row would
    # have mounted BOTH the host backend and the client surface; pinning the
    # backend directly still needs the surface row, whose client half fills
    # ui-workspace's directory-flow holes (the "Add workspace…" affordance).
    - id: corum-directory-picker
      name: '@deepseek-ai/dsh-host-directory-picker-native'

    - id: corum-directory-picker-surface
      name: '@deepseek-ai/dsh-client-ui-directory-picker-native'

    # Forked Models settings page: adds the per-model image-input switch to
    # the pi-ai model editor (replaces the disabled official ui-settings-models
    # row above).
    - id: corum-ui-settings-models
      name: '@corum/corum-ui-settings-models'

    # Forked model selector: friendly info hint for a rejected model switch on
    # an image-containing session (replaces the disabled official
    # ui-model-selection row above).
    - id: corum-ui-model-selection
      name: '@corum/corum-ui-model-selection'

    # Forked Plugins settings surface: removes the official
    # SubagentModelSelectionCard registration (replaces the disabled official
    # ui-settings-plugins row above).
    - id: corum-ui-settings-plugins
      name: '@corum/corum-ui-settings-plugins'

    # 本地 LLM（Ollama）：host 半 provide cordis 服务 `localLlm`（探测/管理引擎 +
    # OpenAI 兼容推理）并给官方 `llm` 服务注册 `ollama` provider（本地模型可当
    # Agent 驱动 LLM / 润色引擎）；client 半在「设置 → 扩展」注册「本地 LLM（Ollama）」
    # section。⚠️ 行 id 必须用**短 id**（不含 `/`）：client bundle 的 URL 是
    # `/plugins/<行 id>/client.js`，用包名当 id 会 404。也不要再把它加进 combo
    # `plugins`（combo 只放纯 host 插件），否则与本节构成双 mount。
    # ⚠️ 2026-09-09 回归：本行与下一条 corum-artgen 行曾只存在于**未提交的工作树**
    # （package.json deps / 本文件 insert 行都没进 git），0.1.3 基座升级期间工作树
    # 被重置后两个插件的设置页一起消失（用户报障）。现已提交，并加
    # scripts/verify-fork-drift.sh §8 断言守护。
    - id: corum-ollama
      name: '@corum/corum-ollama'

    # 通用记忆底座（讨论定稿；产品形态见 docs/PLAN-memory-settings-product-design.md）：
    # host 半 provide cordis 服务 `memory`（MemoryService —— 事实级记忆组织 + 人工修剪），
    # client 半在「设置 → 智能体」组注册**两个** section（记忆 · 全局设置 order 60，顶掉
    # 壳里那个 19 项全 disabled 的假清单；记忆 · 记忆库 order 61）。
    # 只承载「组织形式」，不绑定任何记忆来源。存储复用官方 dsh-storage-domain
    # （ctx.storageDomain），域 corum_memory、表 facts。装配规则同 corum-ollama
    # （短 id + 只在此处 mount）。行序在 corum-ollama 后（无依赖顺序要求，
    # storageDomain 由官方 base bundle 提供，早于本行）。
    - id: corum-memory
      name: '@corum/corum-memory'

    # ⚠️ `corum-memory` settings namespace **必须 boot 常驻**（同 corum-subagent-settings
    # 的实测教训）：该 ns 只在「按需打开的设置页」里注册的话，冷启动时
    # `settings/describe` 里没有它 ⇒ 设置中心「记忆」页的参数读不到 settings.yaml 里
    # 已存的值、写入报 `settings namespace "corum-memory" is not registered`、
    # 「恢复默认」也无从判断哪些键被覆盖过。
    # 行序在 corum-memory 之前 ⇒ 本行先注册；服务侧走 `acquireMemorySettingsScope`
    # （容忍「已被注册」——官方 register 对重复注册抛错）。
    - id: corum-memory-settings
      name: '@corum/corum-memory/settings-registrar'

    # 本地文生图：host 半 provide cordis 服务 `corumArtGen`（sd-cli 引擎/模型下载 +
    # txt2img，长任务走事件推送）；client 半在「设置 → 扩展」注册「本地文生图」
    # section。装配规则同 corum-ollama（短 id + 只在此处 mount）。
    - id: corum-artgen
      name: '@corum/corum-artgen'

    # The desktop bundle's own host + client halves. The host half
    # (corum-desktop-app, src/index.ts) provides the desktop surface prompt +
    # DSH_CORUM_DESKTOP shell variable; the client half (src/client/index.ts)
    # registers framework surfaces: the notification store + the resident Monaco
    # editor column (with embedded resource-manager sub-pane) into the shell's
    # `corum.editor` slot. Without this entry the ModuleRegistry never discovers
    # the dsh.client declaration and the editor + resource manager never mount.
    - id: corum-desktop-app
      name: 'corum-desktop'
