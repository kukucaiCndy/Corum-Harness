# The corum-desktop bundle patch: the desktop surface over the web profile.
# Applied as the HIGHEST overlay layer when the Electron main boots the `web`
# profile.
#
# Transport stance (0.1.2): the official web transport is RETAINED. The
# renderer no longer rides a custom IPC bridge — it loads the official web
# surface over loopback HTTP directly (`loadURL` of the authenticatedUrl the
# host reports). This overlay therefore only PINS the official rows for the
# desktop: loopback-only bind on an ephemeral port, no default-browser
# handoff, and no URL line (the shell owns the window). The rest of the web
# composition (agent presets, every ui-* row, storage, workspace, session
# projection, the base rows) stays untouched.
#
# A patch replaces the targeted row's whole config; `disabled: true` takes the
# row out of the tree without deleting it, so the web surface remains intact
# for a plain `dsh web` boot that never applies this overlay.

# ── official web transport, pinned for the desktop surface ─────────────────

# node:http server + route registry. The renderer reaches it over loopback on
# an ephemeral port (port 0 → the OS assigns one; the host reads the real port
# back from ctx.webServer.port and reports it to the Electron main).
- id: webserver
  config:
    host: '127.0.0.1'
    port: 0
    compression: gzip
    compressionLevel: 1
    compressionThresholdBytes: 1024

# Web glue (dist serving via the webserver fallback seat, web-surface prompt,
# bash variable). The desktop shell owns its window: never open the default
# browser and never print the URL line — the host reports the authenticatedUrl
# to the Electron main over the bridge instead.
- id: web-runtime
  config:
    openBrowser: false
    printUrl: false
    surfaceContext: true
    trustedHosts: []

# ── rows disabled for the desktop surface ──────────────────────────────────

# The official session-log download: a browser surface — its controller drives
# a GET /api/session.export streamed to the browser download manager (an
# `a[download]` click + a "browser is downloading" modal). The native-save
# flow in @corum/corum-session-archive replaces it — so the row is disabled to
# keep one minimal save action and to stop the stray browser-download dialog.
- id: session-log-download
  disabled: true

# The official Models settings page is forked into @corum/corum-ui-settings-models:
# the fork adds a per-model "image input" switch so a hand-declared
# vision-capable model can declare `input: [text, image]` from the UI (the
# official editor only surfaced contextWindow/maxTokens). Disable the official
# row and mount the fork below so only one Models section registers.
- id: ui-settings-models
  disabled: true

# The official model selector is forked into @corum/corum-ui-model-selection: the
# fork presents a rejected model switch caused by an image-containing session
# (model-unavailable) as a friendly info hint instead of a generic
# "operation failed" error toast.
- id: ui-model-selection
  disabled: true

# The auto directory picker resolves bind host / SSH / display, then mounts a
# browse or native backend — the browse backend and the auto row itself inject
# webServer. The desktop surface pins the native backend (koffi FFI, no HTTP).
- id: directory-picker
  disabled: true

# ── desktop persona ─────────────────────────────────────────────────────────

- id: system-prompt
  config:
    persona: >-
      You are a coding agent powered by the {{model}} model. Your working directory is {{cwd}}.

      You are running inside the DeepSeek Harness desktop application.

# ── the desktop rows ────────────────────────────────────────────────────────

- insert:
    # Native-only directory picker (the desktop always sits on the host
    # display); replaces the disabled auto row above. The `-auto` row would
    # have mounted BOTH the host backend and the client surface; pinning the
    # backend directly still needs the surface row, whose client half fills
    # ui-workspace's directory-flow holes (the "Add workspace…" affordance).
    - id: corum-directory-picker
      name: '@deepseek-ai/dsh-host-directory-picker-native'

    - id: corum-directory-picker-surface
      name: '@deepseek-ai/dsh-client-ui-directory-picker-native'

    # Session archive: the desktop session-log surface. Its browser half mounts
    # a "save log to…" action into the session header utilities (native save
    # dialog over the host-built ZIP) and an "import session log" row into
    # General settings — the desktop replacement for the web's browser-download
    # plugin. Its host half rides the host bridge (flush/export/import/delete).
    - id: session-archive
      name: '@corum/corum-session-archive'

    # Forked Models settings page: adds the per-model image-input switch to
    # the pi-ai model editor (replaces the disabled official ui-settings-models
    # row above).
    - id: corum-ui-settings-models
      name: '@corum/corum-ui-settings-models'

    # Forked model selector: friendly info hint for a rejected model switch on
    # an image-containing session (replaces the disabled official
    # ui-model-selection row above).
    - id: corum-ui-model-selection
      name: '@corum/corum-ui-model-selection'
