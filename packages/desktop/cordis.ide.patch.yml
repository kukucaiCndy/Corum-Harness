# corum-desktop — IDE 模式 overlay。
#
# 只有当桌面模式解析为 `ide` 时（`--ide` 启动标志 → CORUM_DESKTOP_MODE=ide）
# 才作为最高 patch 层叠加；`minimal`（默认）完全不加载本层，官方三栏聊天壳
# 保持逐行不变。本层只负责「换壳」：禁用官方 presentation 三行，插入
# @corum/corum-ide-ui（壳）+ 功能插件行。纪律同 cordis.patch.yml：只走行覆盖 +
# insert，不改官方包。

# ── 官方 presentation 三行：IDE 模式禁用 ──────────────────────────────────

# 官方三栏 AppFrame：由 @corum/corum-ide-ui 接管（区域系统 + 槽位 + 主题 +
# ctx.layout 同形服务）。壳重声明 conversation/details/shell.overlay/
# sidebar.settings 同名槽，官方 ui-conversation / ui-settings-general 零改动
# 挂载。
- id: ui-layout
  disabled: true

# 官方侧栏（品牌区 deepseek HARNESS + 官方 chrome）：IDE 壳的左列是
# corum.sidebar 槽（S1 由 @corum/corum-ide-sidebar-ui 填充品牌区 + 会话列表）。壳
# 已重声明 sidebar.settings，设置面板入口不丢。
- id: ui-sidebar
  disabled: true

# 官方工作区浏览区（挂在 sidebar.workspaces 槽内；该槽由 ui-sidebar 声明，
# ui-sidebar 禁用后无处挂载，必须成对禁用）。S1 由 @corum/corum-ide-sidebar-ui 重写
# 会话列表 + @corum/corum-ide-explorer-ui 文件树接管。
- id: ui-workspace
  disabled: true

# 官方对话区（IDE 模式由 @corum/corum-ui-conversation fork 接管——B 方案：官方数据流 +
# corum 自研渲染层。fork 自官方 dsh-client-ui-conversation，包内容一致）。
- id: ui-conversation
  disabled: true

# 官方 Chat 视图（conversation.chat.node 消息节点渲染层；IDE 由 @corum/corum-ui-chat
# fork 接管，fork 自官方 dsh-client-ui-chat）。
- id: ui-chat
  disabled: true

# 官方设置面板（SettingsRoot 触发器+面板一体组件，sidebar.settings occupant）：
# 其面板 position:fixed 渲染在窗格 DOM 内，被网格 .leaf 的 will-change:
# transform + overflow:hidden 困住；DOM 迁移方案已证不可行（React 18 事件
# 委托挂在 root 容器，appendChild 移出后 onClick 全部失效）。IDE 模式由
# @corum/corum-ide-ui 自建壳接管：SettingsShell 组件经 createPortal 挂到
# document.body，sidebar.settings occupant 与 settings.* 子槽声明、chrome
# 内容（trigger/header/close）、General section 与 settings 字典一并由
# ide-shell 补注册。settings.section 的 feature 内容注册（corum-ui-settings-
# models、官方 ui-settings-plugins 等）只依赖子槽声明，不受影响。
- id: ui-settings-general
  disabled: true

# 0.1.2 新增：这四个官方 ui 插件硬依赖 uiConversation 服务（inject），而 ui-conversation
# 已禁用——它们在 IDE 模式永久 pending、阻塞 web boot（报「waiting for service:
# uiConversation」）。IDE 用不到这些官方面板（对话/目标/轨迹/交付物/工作流均由
# @corum/corum-ide-* 自研接管），显式禁用。
- id: ui-workflow-run
  disabled: true

- id: ui-deliverables
  disabled: true

# 2026-09-27：**取消对 ui-goal 的禁用**（用户实测「目标组件完全不显示」⇒ 根因就是本行）。
#
# 当初（0.1.2）禁用的理由是「硬依赖 uiConversation 服务 ⇒ 永久 pending、阻塞 web boot」，
# 并以为「目标面板由 @corum/corum-ide-* 自研接管」——**后半句从未成立**：corum 侧没有任何
# goal 组件（packages/plugins 里零个 goal 文件）⇒ 目标功能被整体丢掉，不是被替代。
#
# 该理由现已不成立：`@corum/corum-ui-conversation`（fork 接管官方 ui-conversation）自己
# 提供同名 `uiConversation` 服务。**隔离实例实测**（home=/tmp/corum-goal-home、`:9333`、
# 日志自报 `desktop mode: ide`）：
#   · 客户端清单 47 → **48**，出现 `@deepseek-ai/dsh-client-ui-goal` ✓
#   · 日志与控制台**均无** `waiting for service: uiConversation` ✓（boot 未被阻塞）
#   · 页面注入官方 GoalBar 样式 `.…_goalGlyph` ⇒ 模块确已挂载 ✓
- id: ui-goal

# 官方轨迹视图 ui-trajectory：**禁用**（2026-09-09，fork #12 接管）。
# 原形态是 conversation.view 槽的「对话 / 轨迹」选项卡；corum 定调的形态是
# 「右上角轨迹按钮 → details 独立抽屉」（HANDOFF-0.1.3 §5），故由 fork 包
# @corum/corum-ui-trajectory 接管 ctx 级注册（轨迹节点定义 / view 构建器 / 字典 /
# uiSession hook），视图本体由 corum-ui-chat 的 DetailsPanel 在 details 抽屉里渲染。
# 两行必须互斥：fork 与官方都注册 conversation.view + 声明
# conversation.trajectory.images 槽（槽声明唯一），同时启用会撞「already declared」。
- id: ui-trajectory
  disabled: true

# 官方 Agent 预设设置面板：IDE 模式由 @corum/corum-ide-ui 自建的 AgentPresetsSection
# 替代（1:1 复刻 design.pen 设置中心）。官方 section 注册 id 'agent-presets'，
# 与 corum-ide-ui 注册的 id 冲突，显式禁用让 corum-ide-ui 版本接管。
- id: ui-agent-preset
  disabled: true

# corum-directory-picker-surface（= dsh-client-ui-directory-picker-native）inject uiWorkspace
# 服务，而 ui-workspace 已禁用——IDE 模式 pending。kkc 侧栏「添加工作区」的目录选择已改走
# ctx.remote.directoryPicker.pick()（host backend corum-directory-picker 提供 Remote，不经
# uiWorkspace），故此 surface 插件 IDE 不需要，显式禁用。注意：desktop patch 的
# corum-directory-picker（host backend）保留——它是 directoryPicker Remote 的提供者。
- id: corum-directory-picker-surface
  disabled: true

# 官方审批 ui-approval：IDE 模式由 @corum/corum-ui-approval fork 接管（fork 自官方
# dsh-client-ui-approval，包内容一致）。fork 的 client apply 与官方逐字节一致：
# (1) 注册 remote.$on('approval/request') answerer——泳道工具审批 waterfall 经官方
# remote-waterfall 转发到此，answerer 创建 PendingApproval 并 publish 进
# ctx.uiSession.pendingInteractions（kkc 自研审批卡读此快照渲染 + answer() 应答）——
# **审批数据通路由 fork 原样保留**；(2) 在 conversation.composer 槽注册 ApprovalPanel
# （该槽声明者现为 @corum/corum-ui-conversation fork，正常接管渲染）。若只禁用不挂
# fork，answerer 不注册 → 泳道审批 fail-closed (unavailable)，审批卡永不出。
- id: ui-approval
  disabled: true

# 官方提问 ui-user-questions：命中 PendingQuestion 时接管整个 composer（遮盖对话
# 历史与输入框，用户正在编辑的下一条指令被迫中断）。IDE 模式由
# @corum/corum-ui-questions fork 接管——数据通路复用官方（同一
# user-questions/request Remote waterfall + PendingQuestion 语义），渲染层替换为
# conversation.input.dock 的提问卡片（design.pen K2M4e9：输入框正上方、不遮盖，
# 答完才能发经 ConversationController.blocks 拦截）。若只禁用不挂 fork，
# user-questions/request 无 answerer → ask_user_question 工具挂起无解。
- id: ui-user-questions
  disabled: true

# 会话内容搜索：base bundle 默认 openAt: never（搜索禁用、仅标题/工作区名匹配）。
# IDE 侧栏任务模式搜索框需要真实内容检索，按官方建议（base cordis.patch.yml
# session-query-sqlite 行注释）在更后 patch 层覆盖 openAt 启用：惰性首次搜索打开
# SQLite、索引进程内存（:memory:，启动零开销、重启重建）。
- id: session-query-sqlite
  config:
    path: ':memory:'
    openAt: first-search

# 访问权限三档的中文呈现（新建任务表单数据源 = corumAgent.listPermissionPresets）。
# base 已挂 dsh-permission-presets 并配好三档的 sandbox/approval 捆绑，但**未配**
# 客户端呈现字段（name/description）——UI 直接显示会露出 preset key
# （read-only / workspace-write / danger-full-access）。这里按官方 PresetSpec
# 补 name + description（只加呈现，不动捆绑语义）；defaultPreset 保持官方
# 推断（= 组合默认的 workspace-write，与 sandbox-policy 的 mode 一致）。
- id: permission
  config:
    presets:
      read-only:
        sandbox: read-only
        approval: ask
        name: 只读
        description: 只能读取文件，不做任何修改
      workspace-write:
        sandbox: workspace-write
        approval: ask
        name: 工作区读写
        description: 可在工作目录内读写文件
      danger-full-access:
        sandbox: danger-full-access
        approval: never
        name: 完全权限
        description: 不受限制，可访问工作区外文件

# ── corum IDE 行 ──────────────────────────────────────────────────────────
- insert:
    # 壳：区域系统（column/bar/drawer/overlay/floating 槽位）+ 几何求解
    # （让位链/拖拽把手/窄屏收起）+ 液态玻璃主题（corum-glass token 层 +
    # 玻璃 CSS + ambient 光斑）+ ctx.layout 面板动作面 + ThemePresenter。
    # 取代旧 @corum/corum-layout + @corum/corum-theme 两包。
    - id: ide-shell
      name: '@corum/corum-ide-ui'

    # 统一标题栏（2026-09-30）：窗口顶部 40px 这条带子的**唯一 owner**——拖拽
    # 命中区 + 窗口控制按钮 + 会话段全部在这里（壳只留惰性挂载位 corum.titlebar）。
    # 此前这条带子被壳与对话区 leaf 内的会话顶栏分别持有，折叠态下后者的空态拖拽带
    # 盖住前者的控件层 ⇒ 物理鼠标点「展开」被当拖拽吞掉（drag 位图不遵守 z-index，
    # 显式 no-drag 也凿不掉；CDP 合成事件绕过命中判定，脚本验不出）。
    # **基础能力、不可停用**（plugin-manager.ts 的 CORE_PLUGIN_PACKAGES）——
    # 带子没了就没有窗口按钮与会话标题。
    - id: ide-titlebar
      name: '@corum/corum-ui-titlebar'

    # ── 真实功能插件（design.pen 区域实现）──
    # 左列骨架 + 任务模式（开源版核心）：占 corum.sidebar 并声明
    # corum.sidebar.sessions / corum.sidebar.project 两个子槽，自填 sessions
    # （design.pen ①）。project 子槽**在开源仓恒为空** → 骨架不显示「项目」tab。
    - id: ide-sidebar
      name: '@corum/corum-ide-sidebar-ui'
    # ⚠️ 项目模式内容（`@corum/corum-ide-project-ui`，付费版组合）**已迁出本仓**
    # （2026-09-26 开源/闭源剥离）：原 `- id: ide-project` 挂载行现属闭源仓
    # **Corum-Harness-Project**（该仓的部署组合/补丁在此处插入同一行）。
    # 闭源仓未安装时 corum.sidebar.project 槽为空 —— 正是上面那条注释描述的开源形态
    # （骨架隐藏「项目」tab），故本仓不保留占位行也不留悬空引用。
    # 资源管理器：2026-09-03 设计改版并入编辑器合并卡（corum.editor 槽内嵌
    # ExplorerPane 子面板，corum-desktop client 直通 listDir/generation）——
    # 原独立插件 @corum/corum-ide-explorer-ui 已解挂，代码保留备查，如需回退
    # 独立区域形态重新挂载本行。
    # - id: ide-explorer
    #   name: '@corum/corum-ide-explorer-ui'
    # 对话区：B 方案 fork 基座——@corum/corum-ui-conversation（官方数据流骨架 fork）+
    # @corum/corum-ui-chat（消息节点渲染层 fork）。fork 版先按官方默认渲染跑通泳道，
    # 后续在 fork 内逐卡重构成 corum 重设计（见 PLAN-conversation-ui-redesign.md）。
    # 两包依赖 kkc 壳提供的同形 ctx.layout + fork 的 uiConversation 服务，审批 answerer
    # 由 ui-approval 提供（pendingInteractions 通路不变）。
    - id: corum-conversation
      name: '@corum/corum-ui-conversation'
    - id: corum-chat
      name: '@corum/corum-ui-chat'
    # 轨迹视图 fork：@corum/corum-ui-trajectory（官方 ui-trajectory 定制版，
    # fork #12，docs/fork-delta.md §14）——保留官方全部 ctx 级注册（轨迹节点定义 /
    # conversation view 构建器 / 字典 / uiSession trajectory hook），**不注册**
    # conversation.view（details 槽 kind:'single'，occupant 归 corum-ui-chat 的
    # DetailsPanel，它在抽屉里渲染本包导出的 TrajectoryView）。上方顶层
    # `- id: ui-trajectory disabled: true` 与之互斥（槽声明唯一）。
    - id: corum-ui-trajectory
      name: '@corum/corum-ui-trajectory'
    # 审批呈现层 fork：@corum/corum-ui-approval（fork 自官方 dsh-client-ui-approval）。
    # remote.$on('approval/request') answerer + uiSession.registerPendingInteraction 与
    # 官方一致（pendingInteractions 审批通路不变）；ApprovalPanel 挂 fork conversation 的
    # conversation.composer 槽。首版与官方行为一致，后续在 fork 上重构为 corum 审批卡。
    - id: corum-approval
      name: '@corum/corum-ui-approval'
    # 提问卡片 fork：@corum/corum-ui-questions（替代官方遮盖式 composer 接管）。
    # 输入框正上方 dock 卡片（conversation.input.dock，非 composer.dock——后者是
    # InputBar 的 footer、渲染在输入卡下方）、不遮盖对话与输入框；数据通路复用官方
    # user-questions/request waterfall + PendingQuestion 语义；提问挂起期间经
    # conversation.blocks 拦截发送（答完才能发）。替代上面禁用的官方行。
    - id: corum-questions
      name: '@corum/corum-ui-questions'
    # 模型不可用的决定面板：@corum/corum-ui-model-ask（design.pen jO5So「方案C」）。
    # 走 **host 侧独立通路** corum/model-ask/request（waterfall），**不借**
    # user-questions/request——后者是 LLM 主动提问的通路，机制级询问与模型提问共用
    # 一条 waterfall 会互相截获。同样挂 conversation.input.dock（不遮盖对话与输入框），
    # 通知条 → 点「处理」就地展开为决定面板（四档位 + 内嵌模型选择，一轮完成）。
    - id: corum-model-ask
      name: '@corum/corum-ui-model-ask'
    # turn-stopping 阻塞式提交卡片（fork corum 2026-10-08）：走 host 侧独立通路
    # corum/commit-card/request（waterfall）+ corum/commit-card/update（emit），
    # 卡片无按钮（阻塞由机制保证），挂 conversation.input.dock。三态状态展示：
    # 待提交（diff 摘要 + AI 审查中）→ 进行中（进度条）→ 已完成（分笔提交列表）。
    - id: corum-commit-card
      name: '@corum/corum-ui-commit-card'
    # 自研对话区 @corum/corum-ide-conversation-ui **已整体删除**（2026-09-11 用户定调）：
    # 它在 B 方案里已被 fork（corum-ui-conversation + corum-ui-chat）取代、挂载行长期注释，
    # 而且其 taskLine 是写死的假数据。需要时从 git 历史取回该包并恢复本行、禁用上面两行 fork。
    # 底部面板：终端/待办/队列 tabs + 终端（design.pen ⑥）。
    - id: ide-panel-bottom
      name: '@corum/corum-ide-panel-bottom-ui'
    # 插件中心（业务 chrome 拆出壳，NEXT-PHASE-DEFERRED §3）：已安装清单/检索/
    # 视图管理三区 FloatingLayer 面板。经 ctx.layout.onOpenPluginManager 订阅面
    # 认领壳的打开信号（统一事件中心三-2 服务化，原 CustomEvent 广播已退役）；
    # 壳只持触发器不再持面板。
    - id: ide-plugin-manager
      name: '@corum/corum-ide-plugin-manager-ui'
    # 集成中心 ·「插件」内容页（PR5）：GPT 式插件市场 + 已装管理
    # （design.pen yXkOK F1）。**本行 = 加载 + 挂载**：页面本体经
    # `corum.integrations.plugins` 槽挂进集成中心 —— 该父槽由集成中心骨架
    # （@corum/corum-ide-ui，PR4 已合入：活动栏「插件」图标 + 全屏独占工作面 +
    # 左侧子导航）声明，本包 client apply 里的 ctx.slots.inject 已转正为 live
    # 代码（声明先于注册由 inject 保证）。
    - id: ide-integrations
      name: '@corum/corum-ide-integrations-ui'
    # 集成中心内容页（PR6）：MCP 页（McpPage）+ 技能页（SkillsPage）。
    # 两页原为设置中心的 SettingsMcpSection / SettingsSkillsSection，PR6 迁出为
    # 集成中心的内容页 —— 设置中心已同步删掉 mcp / skills 两条 SECTION_DEFS 注册。
    #
    # **本行 = 加载 + 挂载**：本包的 client apply 把两个页面经 ctx.slots.inject
    # 注册进 `corum.integrations.mcp` / `corum.integrations.skills` —— 两槽的
    # **声明权归骨架 @corum/corum-ide-ui**（声明 = 排他渲染权），PR4 已合入并在
    # 它的 root 条目 children 表里声明，本包只作 occupant（不自己声明，否则撞
    # 「already declared」）。
    - id: ide-integrations-pages
      name: '@corum/corum-ide-integrations-pages-ui'
    # 状态栏已整体移除（corum.statusBar 槽不再由 ide-shell 声明/渲染）；
    # @corum/corum-ide-statusbar-ui 插件代码保留在 packages/plugins/ui/ide-statusbar
    # 备查，如需恢复可重新挂载本行。
