# corum desktop preset overrides (0.2.1-rc.3).
#
# The official dsh-web-app bundle already inserts four preset declarations
# (standard/ptc/minimal/cordis) and the agent-preset-registry row. This file
# overrides those four rows' `config.plugins` by id, replacing the official
# delegation section with corum's three-instance subagent tool
# (@corum/corum-tool-subagent: worker + research + fork) and adding corum's
# centralized skill-filesystem override. The fifth preset — `conductor` — is
# corum-only, so it is `insert`ed here with its full declaration.
#
# A patch replaces the targeted row's whole `config`, so each override row
# restates every key it owns (id / order / plugins). The corum orchestration
# replacements (concurrent-aware isolation / model lock / orchestrate /
# settlement notice) are identical across standard/ptc/cordis/conductor; the
# preset tool surface must be consistent so that `applyChildComposition` joins
# an identical standing scope.
#
# Source of truth for the corum overrides: the former
# `shipped-presets/official/*/agent.cordis.yml` files (now retained only as
# reconciliation artifacts; the runtime reads this patch file instead). The
# official rc3 baseline is `packages/bundle/web-app/presets/*.patch.yml`.
#
# disabled rows carry a dual duty (AGENTS.md red line 5): they suppress the
# official package so the fork can monopolize the cordis service name. Never
# filter them out of the boot() layer stack.

# ── preset-standard: override config.plugins with corum delegation ─────────
- id: preset-standard
  config:
    id: standard
    order: 1
    plugins:
      - id: persona
        name: '@deepseek-ai/dsh-persona'
        config:
          prefix: You are a coding agent powered by the {{model}} model.
      - id: agent-instructions
        name: '@deepseek-ai/dsh-agent-instructions'
        config:
          maxBytes: 65536
      - id: time-context
        name: '@deepseek-ai/dsh-time-context'
      - id: tool-bash
        name: '@deepseek-ai/dsh-tool-bash'
        disabled: !!js process.platform === 'win32'
      - id: tool-pwsh
        name: '@deepseek-ai/dsh-tool-pwsh'
        disabled: !!js process.platform !== 'win32'
      - id: tool-fs
        name: '@deepseek-ai/dsh-tool-fs'
      - id: tool-fs-search
        name: '@deepseek-ai/dsh-tool-fs-search'
        config:
          sampleOverCapGlobResults: false
      - id: tool-jobs
        name: '@deepseek-ai/dsh-tool-jobs'
      - id: tool-schedule
        name: '@deepseek-ai/dsh-tool-schedule'
      # corum: centralized skill management — only $CORUM_HOME/skills is visible.
      - id: skill-filesystem
        name: '@deepseek-ai/dsh-skill-filesystem'
        config:
          includeDefaultRoots: false
          customSkillDirs:
            - !!js "process.getBuiltinModule('node:path').join(process.env.CORUM_HOME || process.env.DSH_HOME || (process.getBuiltinModule('node:os').homedir() + '/.corum'), 'skills')"
      - id: tool-skill
        name: '@deepseek-ai/dsh-tool-skill'
      - id: command-goal
        name: '@deepseek-ai/dsh-command-goal'
      - id: tool-goal
        name: '@deepseek-ai/dsh-tool-goal'
      - id: planning
        name: cordis:group
        group: true
        isolate:
          planMode: true
        config:
          - id: plan-mode
            name: '@deepseek-ai/dsh-plan-mode'
            config:
              section: |
                You are in plan mode. Stay in plan mode until exit_plan_mode succeeds or the user switches the session mode. Imperative language to implement changes means plan the implementation, not execute it. A user's conversational agreement — including an answer confirming something you asked — approves nothing and does not end plan mode; fold the confirmed decision into the plan and submit it through exit_plan_mode.

                Explore first. Use non-mutating reads, searches, static analysis, and checks to ground the plan in the actual repository. Do not edit or write files, change configuration, run formatters or code generation that rewrites tracked files, commit, or otherwise carry out the plan. Prefer existing functions and patterns over new machinery.

                The tool catalog stays the same across modes for request-cache stability. These plan-mode rules override any later tool description or guidance that suggests using mutation tools; those tools remain listed to keep the tool catalog unchanged. Do not use todo_write to track this planning phase: it tracks implementation after an approved plan, while the plan itself belongs in exit_plan_mode.

                Resolve discoverable facts by inspection. Use ask_user_question only for user-owned choices or material ambiguity that inspection cannot answer. Do not ask the user where code lives or how current behavior works when you can find out.

                Make the plan decision-complete: state the goal and success criteria; group implementation changes by subsystem; identify public API, schema, and data-flow changes; cover edge cases, failure modes, tests, acceptance criteria, and explicit assumptions. Keep it concise enough to review but detailed enough so that another engineer can implement it without making design decisions.

                When ready, call exit_plan_mode with the complete plan markdown, starting with a # title. Make exit_plan_mode the only and final tool call in that assistant response: it presents the plan for approval, and implementation begins only in a later step after approval. Do not paste the final plan as a plain reply or ask "should I proceed?" through prose or ask_user_question. If review rejects it, incorporate the feedback and present again. If the review channel is unavailable or aborted, stay in plan mode and ask the user to switch modes manually; do not proceed with implementation.
      - id: compaction
        name: cordis:group
        group: true
        isolate:
          compaction: true
          toolResultPruner: true
        config:
          - id: compaction-basic
            name: '@deepseek-ai/dsh-compaction-basic'
          - id: command-compact
            name: '@deepseek-ai/dsh-command-compact'
          - id: tool-result-pruner
            name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
            config:
              thresholdChars: 8192
              headChars: 4096
              tailChars: 1024
      # corum delegation: three @corum/corum-tool-subagent instances (worker +
      # research + fork) replacing the official single tool-subagent row; the
      # official fork/codex/claude-code rows stay disabled; workflow engine +
      # ralph restored with corum providers.
      - id: delegation
        name: cordis:group
        group: true
        isolate:
          workflowEngine: true
        config:
          - id: tool-subagent-control
            name: '@deepseek-ai/dsh-tool-subagent-control'
          - id: tool-subagent-list-agents
            name: '@deepseek-ai/dsh-tool-subagent-control/list-agents'
          - id: tool-subagent
            name: '@corum/corum-tool-subagent'
            config:
              provider: corum-spawn
              toolName: subagent
              modelSelectionSettings: false
          - id: tool-subagent-research
            name: '@corum/corum-tool-subagent'
            config:
              provider: corum-spawn
              toolName: subagent_research
              modelSelectionSettings: false
              readonlyResearch: true
          - id: tool-subagent-fork
            name: '@corum/corum-tool-subagent'
            config:
              provider: corum-fork
              toolName: subagent_fork
              modelSelectionSettings: false
          - id: tool-subagent-codex
            name: '@deepseek-ai/dsh-tool-subagent'
            disabled: true
            config:
              provider: codex
              toolName: subagent_codex
              maxDepth: provider-managed
          - id: tool-subagent-claude-code
            name: '@deepseek-ai/dsh-tool-subagent'
            disabled: true
            config:
              provider: claude-code
              toolName: subagent_claude_code
              maxDepth: provider-managed
          - id: workflow-worker-thread
            name: '@deepseek-ai/dsh-workflow'
            config:
              provider: corum-spawn
          - id: tool-workflow
            name: '@deepseek-ai/dsh-tool-workflow'
            disabled: true
          - id: tool-ralph
            name: '@deepseek-ai/dsh-tool-ralph'
            config:
              subagentProvider: corum-tracked
      - id: tool-ask-user
        name: '@deepseek-ai/dsh-tool-ask-user'
      - id: tool-todo
        name: '@deepseek-ai/dsh-tool-todo'
        config:
          allowParallelInProgress: true
      - id: tool-web
        name: '@deepseek-ai/dsh-tool-web'
        config:
          fetch: true
          searchTimeoutMs: 60000
      - id: present
        name: '@deepseek-ai/dsh-tool-present'
      - id: tool-plugin-manager
        name: '@deepseek-ai/dsh-plugin-manager/tools'
        disabled: true
      - id: tool-plugin-market
        name: '@deepseek-ai/dsh-plugin-market/tools'
        disabled: true

