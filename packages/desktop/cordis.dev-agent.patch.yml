# corum-desktop — dev-agent 模式 overlay。
#
# 只有当桌面模式解析为 `dev-agent` 时（CORUM_DESKTOP_MODE=dev-agent）
# 才作为最高 patch 层叠加。本层禁用官方 presentation 行（同 IDE 模式），
# 插入 @corum/corum-agent-ui-dev（Agent 开发验证 UI 壳）。
#
# 与 IDE 模式的区别：dev-agent 模式不需要 ide-sidebar / ide-conversation
# 等完整功能插件，只挂一个 dev-agent-shell 占据 root 槽，配合 dev-agent
# combo 插件（CorumAgentService）做 Agent 核心验证。

# ── 官方 presentation 三行：dev-agent 模式禁用 ──────────────────────────

- id: ui-layout
  disabled: true

- id: ui-sidebar
  disabled: true

- id: ui-workspace
  disabled: true

- id: ui-conversation
  disabled: true

- id: ui-settings-general
  disabled: true

# 0.1.2 新增：官方 Chat 视图 ui-chat——其子槽声明者 ui-conversation 已禁用，会因缺
# uiConversation/layout 服务而永久等待（slots.inject 等待语义下静默不报错）。显式禁用
# 以消除 client 树空转；dev-agent 模式由 @corum/corum-agent-ui-dev 占据 root 槽。
- id: ui-chat
  disabled: true

# 官方审批 ui-approval：由 @corum/corum-ui-approval fork 接管（同 IDE 模式，保持两个
# 组合审批通路同一实现）。fork 的 remote.$on('approval/request') answerer 与官方一致，
# 把泳道工具审批 publish 进 ctx.uiSession.pendingInteractions（dev-agent 测试面板/未来
# 审批卡读此渲染 + answer 应答）——审批数据通路由 fork 原样保留。其 ApprovalPanel 的
# conversation.composer 槽注册因 ui-conversation 禁用而自然空转、不渲染（slots.inject
# 等待语义，静默不报错）。只禁用不挂 fork 会断审批数据通路（answerer 不注册 → 审批
# fail-closed），故禁用官方行 + insert fork 行。
- id: ui-approval
  disabled: true

# ── dev-agent-shell 行 ──────────────────────────────────────────────────
- insert:
    # Agent 开发验证 UI 壳：注册 root 槽 + AgentTestPanel（经 RPC 桥
    # 调 /api/corumAgent/* 端点验证 Agent 核心）。
    - id: dev-agent-shell
      name: '@corum/corum-agent-ui-dev'
    # 审批呈现层 fork：@corum/corum-ui-approval（fork 自官方 dsh-client-ui-approval）。
    # 只取数据通路：remote.$on('approval/request') answerer + uiSession.
    # registerPendingInteraction 与官方一致；ApprovalPanel 的 conversation.composer
    # 槽注册因 ui-conversation 禁用而空转，不影响 dev-agent 壳。
    - id: corum-approval
      name: '@corum/corum-ui-approval'

# 注意：@corum/corum-team-ui-dev 无 dsh.client 声明（同 corum-skill-manager-ui-dev），
# 不进 boot 图、不作为独立 client 插件挂载——它只是被 AgentTestPanel「团队」tab
# 源码 import 内联进 agent-ui-dev bundle 的组件库。因此此处无需 insert 行。
