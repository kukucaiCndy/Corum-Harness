packages:
  - packages/desktop
  - packages/desktop/desktop-host
  - packages/plugins/ui/*
  - packages/plugins/session/*
  - packages/plugins/agent/*
  # 构建工具包（`@corum/plugin-build`：插件构建契约的唯一载体，见 docs/PLUGIN-SPEC.md §7）。
  # 它不是插件（不挂载、不进 plugin-manager），所以不在 packages/plugins/** 下。
  - packages/tooling/*
  # SDK（`@corum/plugin-sdk`：第三方插件的最小依赖面 —— 零运行时逻辑，只聚合类型与
  # 公开层 API。见方案 §A.2 / docs/PLUGIN-SPEC.md）。
  - packages/sdk/*
  # 第三方插件的最小可运行样例（P6）。它**不是** corum 自己的插件：
  # 只依赖 @corum/plugin-sdk + @corum/plugin-build，用来证明「第三方能独立写出可挂载插件」。
  - examples/*
  # 未来按需扩展的分组（复用官方/社区插件为主，只有差异化的才收录）：
  #   - packages/plugins/context/*
  #   - packages/plugins/workflow/*

  # The desktop carrier resolves its own Node runtime and host closure; plugin
  # packages resolve the official dsh foundation from the npm registry, not from
  # a local checkout. Keep linkWorkspacePackages on so plugins can import each
  # other by workspace:^ during development.
onlyBuiltDependencies:
  - node-pty
  - koffi
  - protobufjs
  - '@deepseek-ai/dsh-subprocess-local'
  - '@google/genai'
  - esbuild
allowBuilds:
  '@deepseek-ai/dsh-subprocess-local': true
  '@google/genai': true
  esbuild: true
  fs-ext: true
  koffi: true
  node-pty: true
  protobufjs: true
linkWorkspacePackages: true
# dsh 0.1.3 由本地私服刚发布（发布时间 < pnpm 默认 minimumReleaseAge 1 天 cutoff），
# 升级期间显式放行新包；待官方 0.1.3 上公共 registry 后可删除本行。
minimumReleaseAge: 0
overrides:
  # 打包闭包必须与工作区同版本：pnpm deploy --legacy 忽略 lockfile 重新解析，
  # ^0.2.1-rc.3 会漂到 registry 上的 rc.4（npm 上 dsh-hmr@0.2.1-rc.3 的 dist-tags.next
  # 已是 0.2.1-rc.4）。pnpm 11 的 override 不支持 glob，所以下面逐个钉死。
  # 列表来源：官方 dsh-v0.2.1-rc.3 tag 全量公开 @deepseek-ai/* 包（scripts/generate-rc3-overrides.mjs），
  # 排除 private 包（8 个），排除 cordis-plugin-hmr（dsh-hmr 继任，旧 override 删除）、
  # cordis-plugin-logger-console（corum 不装配）。
  # 公开 dsh 包 + native addon + vendor + fork + electron = 357 条

  '@deepseek-ai/dsh': '0.2.1-rc.3'
