  # ⚠️ Electron **必须钉死**（2026-10-09 实测事故，台账 bug.credentials-keychain-acl-tied-to-electron-cdhash）：
  # 本仓用 `safeStorage`（macOS 钥匙串）封装凭据主密钥，而钥匙串条目的访问权**绑定
  # 请求方的代码身份（cdhash）**。本仓是 ad-hoc 签名（无 Team ID ⇒ 无稳定身份），
  # 所以**换一个 Electron 版本 = 换一个 cdhash = 条目 ACL 失配** ⇒ 系统弹「输入登录密码」，
