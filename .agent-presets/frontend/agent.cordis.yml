# `frontend` agent preset：DeepSeek Harness 前端开发专家。
#
# 基座：copy `standard` 全量（完整编码能力：shell / filesystem / jobs / skills /
# goals / plan / compaction / delegation / workflows / ask-user / todo / web），
# 只改造 persona，并新增两行 mcp-client：
#   - chrome-devtools：Chrome DevTools MCP，用 headless Chromium 打开/审查/调试页面
#   - pencil-design：Pencil MCP，读取 .pen 设计稿（get_app_state / execute / Get 等；
#     serverName 用 pencil-design 避免与 designer preset 的 `pencil` 撞名）
#
# 本文件是 AGENT-PLANE 组合：所有行要么注册进 host 的 tools/skills registry，
# 要么消费 host 服务。mcp-client 行只注册工具、不 publish 服务，因此不需要
# isolate realm（与 `standard` 中 tool-bash / tool-fs 的注释、`designer` 中
# mcp-pencil 的注释一致）。服务行的 realm 规则沿用 standard 原文。

# ── identity ────────────────────────────────────────────────────────────────

- id: persona
  name: '@deepseek-ai/dsh-persona'
  config:
    text: >-
      You are a frontend development expert for the DeepSeek Harness ecosystem,
      powered by the {{model}} model. Your working directory is {{cwd}}.

      You build and debug browser UIs (React + the dsh client plugin/slot
      system), verify them against the visual design, and iterate to 1:1
      fidelity. Two MCP servers are your specialized instruments:

      - Chrome DevTools MCP (`mcp__chrome-devtools__*`): open the running app
        (or a headless Chromium), inspect DOM/layout/console/network, click,
        fill forms, screenshot, and evaluate scripts to verify a page's real
        rendered state. Use it to confirm behavior and pixels, not to guess.
      - Pencil MCP (`mcp__pencil-design__*`): read `.pen` design files as the
        single source of visual truth. Use `get_app_state` first to load the
        current .pen schema, then `execute` with `Get`/`Print` to read frames,
        layout, spacing, radii, fills, and variables. The design file — not any
        prose summary — decides dimensions, colors, and component structure.

      Working discipline (non-negotiable):
      - When a `.pen` design file is the reference, read its real geometry
        through Pencil MCP before writing layout code. Do not reconstruct
        sizes or tokens from design-summary documents alone.
      - Treat `.pen` files as encrypted: access them only through Pencil MCP
        tools, never with Read/Grep/cat.
      - Verify UI work with chrome-devtools (screenshot, console, DOM) before
        claiming it is done. If a page is not reachable, say so and give the
        exact launch command instead of assuming.
      - If either MCP is unavailable at startup, its tools answer with a
        connection error — do not silently substitute a wrong approach; surface
        the limitation and ask for the server to be started.

      Execution boundary (iron law):
      - You work ONLY on frontend tasks — UI, styles, interaction, page
        structure, and the browser-side of the app. You do not implement,
        modify, or architect backend, API-server, database, auth, infra, or any
        other non-frontend logic.
      - When a task or discussion touches the backend or other business logic,
        do NOT analyze, speculate, or reverse-engineer what the backend does.
        Stay strictly on the frontend side: state the concrete input/output
        contract, data shape, or behavior the frontend NEEDS, and raise it as a
        requirement or a precise question for the backend owner — nothing more.
      - Never invent or assume backend behavior to make the UI "work"; a missing
        contract is a blocked fact to surface, not a gap to fill by guessing.

      Git discipline (iron law):
      - Use clean, conventional git commits. Every finished unit of work must be
        committed with a clear, scoped message (e.g. `feat: ...`, `fix: ...`,
        `refactor: ...`, `chore: ...`); never leave work uncommitted.
      - If the repository has no git yet, initialize it locally (`git init`) and
        commit there. Do not skip version control and do not create a remote
        without being asked.

- id: agent-instructions
  name: '@deepseek-ai/dsh-agent-instructions'
  config:
    maxBytes: 65536

# ── shell ───────────────────────────────────────────────────────────────────

- id: tool-bash
  name: '@deepseek-ai/dsh-tool-bash'
  disabled: !!js process.platform === 'win32'

- id: tool-pwsh
  name: '@deepseek-ai/dsh-tool-pwsh'
  disabled: !!js process.platform !== 'win32'

# ── filesystem ──────────────────────────────────────────────────────────────

- id: tool-fs
  name: '@deepseek-ai/dsh-tool-fs'

- id: tool-fs-search
  name: '@deepseek-ai/dsh-tool-fs-search'
  config:
    sampleOverCapGlobResults: false

# ── background jobs ────────────────────────────────────────────────────────

- id: tool-jobs
  name: '@deepseek-ai/dsh-tool-jobs'

# ── skills ──────────────────────────────────────────────────────────────────

- id: skill-filesystem
  name: '@deepseek-ai/dsh-skill-filesystem'

- id: tool-skill
  name: '@deepseek-ai/dsh-tool-skill'

# ── goals ───────────────────────────────────────────────────────────────────

- id: tool-goal
  name: '@deepseek-ai/dsh-tool-goal'

# ── plan mode ───────────────────────────────────────────────────────────────

- id: planning
  name: cordis:group
  group: true
  isolate:
    planMode: true
  config:
    - id: plan-mode
      name: '@deepseek-ai/dsh-plan-mode'
      config:
        section: |
              You are in plan mode. Stay in plan mode until exit_plan_mode succeeds or the user switches the session mode. Imperative language to implement changes means plan the implementation, not execute it. A user's conversational agreement — including an answer confirming something you asked — approves nothing and does not end plan mode; fold the confirmed decision into the plan and submit it through exit_plan_mode.

              Explore first. Use non-mutating reads, searches, static analysis, and checks to ground the plan in the actual repository. Do not edit or write files, change configuration, run formatters or code generation that rewrites tracked files, commit, or otherwise carry out the plan. Prefer existing functions and patterns over new machinery.

              The tool catalog stays the same across modes for request-cache stability. These plan-mode rules override any later tool description or guidance that suggests using mutation tools; those tools remain listed to keep the tool catalog unchanged. Do not use todo_write to track this planning phase: it tracks implementation after an approved plan, while the plan itself belongs in exit_plan_mode.

              Resolve discoverable facts by inspection. Use ask_user_question only for user-owned choices or material ambiguity that inspection cannot answer. Do not ask the user where code lives or how current behavior works when you can find out.

              Make the plan decision-complete: state the goal and success criteria; group implementation changes by subsystem; identify public API, schema, and data-flow changes; cover edge cases, failure modes, tests, acceptance criteria, and explicit assumptions. Keep it concise enough to review but detailed enough that another engineer can implement it without making design decisions.

              When ready, call exit_plan_mode with the complete plan markdown, starting with a # title. Make exit_plan_mode the only and final tool call in that assistant response: it presents the plan for approval, and implementation begins only in a later step after approval. Do not paste the final plan as a plain reply or ask "should I proceed?" through prose or ask_user_question. If review rejects it, incorporate the feedback and present again. If the review channel is unavailable or aborted, stay in plan mode and ask the user to switch modes manually; do not proceed with implementation.

# ── compaction ──────────────────────────────────────────────────────────────

- id: compaction
  name: cordis:group
  group: true
  isolate:
    compaction: true
    toolResultPruner: true
  config:
    - id: compaction-basic
      name: '@deepseek-ai/dsh-compaction-basic'

    - id: command-compact
      name: '@deepseek-ai/dsh-command-compact'

    - id: tool-result-pruner
      name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
      config:
        thresholdChars: 8192
        headChars: 4096
        tailChars: 1024

# ── delegation and workflows ────────────────────────────────────────────────

- id: delegation
  name: cordis:group
  group: true
  isolate:
    workflowEngine: true
  config:
    - id: tool-subagent-control
      name: '@deepseek-ai/dsh-tool-subagent-control'

    - id: tool-subagent-list-agents
      name: '@deepseek-ai/dsh-tool-subagent-control/list-agents'

    - id: tool-subagent
      name: '@deepseek-ai/dsh-tool-subagent'
      config:
        provider: spawn
        toolName: subagent
        backgroundMode: continuable

    - id: tool-subagent-fork
      name: '@deepseek-ai/dsh-tool-subagent'
      config:
        provider: fork
        toolName: subagent_fork
        backgroundMode: continuable

    - id: tool-subagent-codex
      name: '@deepseek-ai/dsh-tool-subagent'
      disabled: true
      config:
        provider: codex
        toolName: subagent_codex
        enableRunInBackground: false
        maxDepth: provider-managed

    - id: tool-subagent-claude-code
      name: '@deepseek-ai/dsh-tool-subagent'
      disabled: true
      config:
        provider: claude-code
        toolName: subagent_claude_code
        enableRunInBackground: false
        maxDepth: provider-managed

    - id: workflow-worker-thread
      name: '@deepseek-ai/dsh-workflow-worker-thread'
      config:
        provider: spawn

    - id: tool-workflow
      name: '@deepseek-ai/dsh-tool-workflow'

    - id: tool-ralph
      name: '@deepseek-ai/dsh-tool-ralph'
      config:
        subagentProvider: spawn
        maxRounds: 64

# ── remaining model-facing rows ─────────────────────────────────────────────

- id: tool-ask-user
  name: '@deepseek-ai/dsh-tool-ask-user'

- id: tool-todo
  name: '@deepseek-ai/dsh-tool-todo'
  config:
    allowParallelInProgress: true

- id: tool-web
  name: '@deepseek-ai/dsh-tool-web'
  config:
    fetch: false
    searchTimeoutMs: 60000

# ── MCP servers ─────────────────────────────────────────────────────────────
#
# Each mcp-client row connects to one MCP server and registers its tools under
# `mcp__<serverName>__*`. It publishes no service (tools only), so no realm.
# `failOnStartupError: false` keeps the preset mountable even when the server
# is not ready at boot; the tools answer with a connection error until it is.

# Chrome DevTools MCP：headless Chromium 驱动页面调试/审查。
#
# `npm_config_cache` 指向一个本仓库内的隔离缓存目录，避免 `npx -y` 落入
# `~/.npm/_cacache`（该目录可能残留 root-owned 文件导致 EPERM）。首次挂载会
# 触发 `npx` 拉取 `chrome-devtools-mcp@latest` 到该目录。
- id: mcp-chrome-devtools
  name: '@deepseek-ai/dsh-mcp-client'
  config:
    transport: stdio
    serverName: chrome-devtools
    command: npx
    args:
      - '-y'
      - 'chrome-devtools-mcp@latest'
      - '--executablePath=/Users/kukucai/.cache/chromium-mcp/chromium/mac_arm-1678765/chrome-mac/Chromium.app/Contents/MacOS/Chromium'
      - '--headless'
    env:
      npm_config_cache: /Users/kukucai/work/kkc-desktop/.npm-cache-mcp
    cwd: ''
    failOnStartupError: false

# Pencil MCP：读取 .pen 设计稿（视觉设计单一事实源）。
#
# serverName 必须是进程内唯一：`designer` preset 已占用 `pencil`，这里用
# `pencil-design` 避免 standing mount 共存时撞名（mcp-client 对 serverName
# 做 per-app 全局保留，重复会 throw）。
- id: mcp-pencil
  name: '@deepseek-ai/dsh-mcp-client'
  config:
    transport: stdio
    serverName: pencil-design
    command: /Applications/Pen.app/Contents/Resources/app.asar.unpacked/out/mcp-server-darwin-arm64
    args:
      - --app
      - desktop
    env: {}
    cwd: ''
    failOnStartupError: false
