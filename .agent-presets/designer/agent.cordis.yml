# `designer` agent preset：桌面端 UI/UX 设计 Agent，通过 Pencil MCP 产出 .pen 设计稿。
#
# 基座：copy `standard` 裁剪 —— 保留 shell / filesystem / skills / ask-user / todo / web，
# 去掉 plan-mode / goals / subagents / workflows / ralph（纯视觉设计不需要），
# 新增一行 mcp-client 连接 Pencil MCP。
#
# 本文件是 AGENT-PLANE 组合：所有行要么注册进 host 的 tools/skills registry，
# 要么消费 host 服务（tools / skills），没有任何一行 publish 服务，因此不需要
# isolate realm。这与 `standard` 中 tool-bash / tool-fs / tool-skill 的注释一致。

# ── identity ────────────────────────────────────────────────────────────────

- id: persona
  name: '@deepseek-ai/dsh-persona'
  config:
    text: >-
      You are a UI/UX design agent that produces polished visual design mockups
      as .pen files through the Pencil MCP tools. You follow the pencil-design
      8-step SOP stored in your skills.

      Design workflow discipline (non-negotiable):
      - All design operations go through the Pencil MCP tools (mcp__pencil__*).
        If Pencil MCP is unavailable (get_editor_state fails), STOP and tell the
        user to configure Pencil MCP — never fall back to hand-drawn SVG or code
        mockups.
      - demo.pen is for style exploration only; design.pen is the final
        deliverable. Never mix operations between the two files.
      - Create demo.pen/design.pen by copying template.pen, never from scratch.
      - No emoji anywhere in the design. Icons/assets are AI-generated then
        background-removed (export → remove_bg.py → crop_pad.py → re-import),
        per the pencil-mcp-api skill.
      - Pause for explicit user confirmation at every SOP checkpoint (style
        samples, asset page, each page). Do not batch-complete and present
        everything at once.
      - Load the pencil-design / pencil-mcp-api / design-execution-plan skills
        through the skill tool before starting, and follow their exact steps,
        prompt templates, and checklists.
      - Use the bash tool to run remove_bg.py / crop_pad.py for background
        removal and edge cleanup.

- id: agent-instructions
  name: '@deepseek-ai/dsh-agent-instructions'
  config:
    maxBytes: 65536

# ── shell ───────────────────────────────────────────────────────────────────

- id: tool-bash
  name: '@deepseek-ai/dsh-tool-bash'
  disabled: !!js process.platform === 'win32'

- id: tool-pwsh
  name: '@deepseek-ai/dsh-tool-pwsh'
  disabled: !!js process.platform !== 'win32'

# ── filesystem ──────────────────────────────────────────────────────────────

- id: tool-fs
  name: '@deepseek-ai/dsh-tool-fs'

# ── skills ──────────────────────────────────────────────────────────────────

# The skill REGISTRY lives in the host composition and is layered per scope:
# these rows register into THIS preset's layer, so they need no realm.
# `customSkillDirs` points at this preset's own `skills/pencil-mcp/` directory,
# whose five sub-skills (pencil-design / pencil-mcp-api / design-execution-plan /
# pencil-to-miniprogram / ui-ux-pro-max) are discovered as directory skills and
# the root SKILL.md as the flat `pencil-mcp` catalog. `baseUrl` is the preset's
# own directory (the same pattern the `cordis` preset uses).
- id: skill-filesystem
  name: '@deepseek-ai/dsh-skill-filesystem'
  config:
    customSkillDirs:
      - !!js "process.getBuiltinModule('node:url').fileURLToPath(new URL('skills/pencil-mcp/', baseUrl))"

- id: tool-skill
  name: '@deepseek-ai/dsh-tool-skill'

# ── Pencil MCP ──────────────────────────────────────────────────────────────

# One mcp-client instance connects to the Pencil desktop MCP server over stdio
# and registers its tools under `mcp__pencil__*`. It publishes no service
# (tools only), so it needs no realm. `failOnStartupError: false` keeps the
# preset mountable even when Pen.app is not running at boot; the tools simply
# answer with a connection error until the server is reachable.
- id: mcp-pencil
  name: '@deepseek-ai/dsh-mcp-client'
  config:
    transport: stdio
    serverName: pencil
    command: /Applications/Pen.app/Contents/Resources/app.asar.unpacked/out/mcp-server-darwin-arm64
    args:
      - --app
      - desktop
    env: {}
    cwd: ''
    failOnStartupError: false

# ── remaining model-facing rows ─────────────────────────────────────────────

- id: tool-ask-user
  name: '@deepseek-ai/dsh-tool-ask-user'

- id: tool-todo
  name: '@deepseek-ai/dsh-tool-todo'
  config:
    allowParallelInProgress: true

# The `web` service and its search provider stay in the host composition; only
# the model-facing tool is per-session.
- id: tool-web
  name: '@deepseek-ai/dsh-tool-web'
  config:
    fetch: false
    searchTimeoutMs: 60000
